name: Valhalla Windows build

on:
  push:
    branches: [valhalla-build]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'slopmaster9000/SCSKiller'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and package Windows x64
        shell: pwsh
        run: |
          ./build/publish.ps1 -NoOodle -NoZip
          @'
          @echo off
          setlocal
          set "SCSKILLER_DATA_DIR=%~dp0data"
          start "" "%~dp0SCSKiller.exe"
          '@ | Set-Content -LiteralPath dist/SCSKiller/Launch-SCSKiller.cmd -Encoding ascii
          Compress-Archive -LiteralPath dist/SCSKiller -DestinationPath dist/SCSKiller-Valhalla-win-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SCSKiller-Valhalla-win-x64
          path: dist/SCSKiller-Valhalla-win-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
